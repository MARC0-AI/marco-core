[project]
name = "marco-core"
version = "0.1.0"
description = "Core intelligence and orchestration engine for MARCO AI."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Prince Doot" }
]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic>=2.10",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
marco = "marco.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "marco"
